<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shorts Trends Feed</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, .swiper { width: 100%; height: 100vh; background: #000; overflow: hidden; }
    
    .swiper-slide {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }

    .player-container {
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .touch-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      background: transparent;
    }

    .loader {
      color: #fff;
      font-family: sans-serif;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div class="swiper mySwiper">
    <div class="swiper-wrapper" id="feed">
      <div class="swiper-slide"><div class="loader">Загрузка трендов... 🔥</div></div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    const API_KEY = 'AIzaSyDAdUwgT0fUEbUBHNTVBdGYKcUNlOLPNf0'; // 👈 ВСТАВЬ СВОЙ КЛЮЧ
    
    let nextPageToken = '';
    const seenVideoIds = new Set();
    const videoIds = [];
    const players = {};
    let swiper;
    let isLoading = false;
    let userHasInteracted = false; // Флаг: взаимодействовал ли пользователь с экраном

    async function fetchTrendShorts() {
      if (isLoading) return;
      isLoading = true;

      let url = `https://www.googleapis.com/youtube/v3/videos?part=snippet&chart=mostPopular&maxResults=10&videoCategoryId=0&key=${API_KEY}`;
      if (nextPageToken) url += `&pageToken=${nextPageToken}`;

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (data.error) {
          alert('Ошибка API: ' + data.error.message);
          return;
        }

        if (data.nextPageToken) nextPageToken = data.nextPageToken;

        const newVideos = [];
        if (data.items) {
          data.items.forEach(item => {
            const id = item.id;
            if (id && !seenVideoIds.has(id)) {
              seenVideoIds.add(id);
              newVideos.push(id);
            }
          });
        }

        appendVideosToFeed(newVideos);
      } catch (e) {
        console.error('Ошибка загрузки:', e);
      } finally {
        isLoading = false;
      }
    }

    function appendVideosToFeed(newIds) {
      const feedContainer = document.getElementById('feed');

      if (videoIds.length === 0 && newIds.length > 0) {
        feedContainer.innerHTML = '';
      }

      newIds.forEach(id => {
        const index = videoIds.length;
        videoIds.push(id);

        const slide = document.createElement('div');
        slide.className = 'swiper-slide';
        slide.innerHTML = `
          <div class="player-container">
            <div id="player-${index}"></div>
          </div>
          <div class="touch-overlay" data-index="${index}"></div>
        `;
        feedContainer.appendChild(slide);
      });

      if (swiper) {
        swiper.update();
      } else {
        initSwiper();
      }
    }

    function onYouTubeIframeAPIReady() {
      fetchTrendShorts();
    }

    function createPlayer(index) {
      if (!players[index] && videoIds[index]) {
        players[index] = new YT.Player(`player-${index}`, {
          videoId: videoIds[index],
          playerVars: {
            'autoplay': 1,
            'controls': 0,
            'rel': 0,
            'loop': 1,
            'playsinline': 1,
            'mute': 1 // Обязательный запуск MUTE для обхода блокировки браузера! 🔇
          },
          events: {
            'onReady': (e) => {
              if (swiper && swiper.activeIndex === index) {
                playPlayer(index);
              }
            }
          }
        });
      }
    }

    function initSwiper() {
      swiper = new Swiper('.mySwiper', {
        direction: 'vertical',
        mousewheel: true,
        slidesPerView: 1,
        on: {
          init: function () {
            createPlayer(0);
          },
          slideChange: function () {
            const current = this.activeIndex;

            // Качаем новые видео при подходе к концу
            if (current >= videoIds.length - 3) {
              fetchTrendShorts();
            }

            // Создаем следующий плеер заранее
            createPlayer(current + 1);

            // Ставим на паузу ВСЕ остальные плееры
            Object.keys(players).forEach(idx => {
              if (players[idx] && players[idx].pauseVideo) {
                players[idx].pauseVideo();
              }
            });

            // Запускаем текущее видео АВТОМАТИЧЕСКИ
            playPlayer(current);
          }
        }
      });

      // Первый же клик/свайп разблокирует звук
      document.addEventListener('click', (e) => {
        userHasInteracted = true;
        if (e.target.classList.contains('touch-overlay')) {
          const idx = e.target.getAttribute('data-index');
          const player = players[idx];
          if (player && player.getPlayerState) {
            if (player.isMuted()) {
              player.unMute();
            } else {
              const state = player.getPlayerState();
              if (state === YT.PlayerState.PLAYING) {
                player.pauseVideo();
              } else {
                player.playVideo();
              }
            }
          }
        }
      });
    }

    function playPlayer(index) {
      if (!players[index]) {
        createPlayer(index);
        return;
      }
      
      const player = players[index];
      if (player && player.playVideo) {
        // Если пользователь уже хотя бы 1 раз кликал на экран — включаем звук!
        if (userHasInteracted) {
          player.unMute();
        } else {
          player.mute();
        }
        player.playVideo();
      }
    }
  </script>
</body>
</html>
