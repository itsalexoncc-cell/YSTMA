<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shorts Feed</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Swiper.js для вертикальных свайпов -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, .swiper { width: 100%; height: 100vh; background: #000; overflow: hidden; }
    .swiper-slide {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="swiper mySwiper">
    <div class="swiper-wrapper" id="feed">
      <!-- Слайды будут генерироваться через JS -->
    </div>
  </div>

  <script>
    // Инициализация Telegram Mini App
    const tg = window.Telegram.WebApp;
    tg.expand(); // Разворачиваем на весь экран
    tg.ready();

    // Список ID видео YouTube Shorts
    const shortsList = [
      'dQw4w9WgXcQ', // Замени на ID своих Shorts
      '3JZ_D3ELwOQ',
      'L_LUpnjgPso'
    ];

    const feedContainer = document.getElementById('feed');

    // Рендерим слайды
    shortsList.forEach(id => {
      const slide = document.createElement('div');
      slide.className = 'swiper-slide';
      slide.innerHTML = `
        <iframe 
          src="https://www.youtube.com/embed/${id}?enablejsapi=1&autoplay=0&controls=1&rel=0&loop=1" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
      `;
      feedContainer.appendChild(slide);
    });

    // Настройка свайпера (вертикальная лента)
    const swiper = new Swiper('.mySwiper', {
      direction: 'vertical',
      mousewheel: true,
      spaceBetween: 0,
      slidesPerView: 1,
    });
  </script>
</body>
</html>
