<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Open Shorts</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100vh;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, sans-serif;
    }

    #screen {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      background-size: cover;
      background-position: center;
      background-color: #111;
    }

    #overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.1) 45%, rgba(0,0,0,0.1) 100%);
    }

    #content {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 24px 20px 40px;
      text-align: center;
      color: #fff;
    }

    #title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 18px;
      line-height: 1.4;
      max-height: 4.2em;
      overflow: hidden;
    }

    #btn {
      display: inline-block;
      background: #fff;
      color: #000;
      font-size: 16px;
      font-weight: 700;
      padding: 14px 32px;
      border-radius: 999px;
    }

    #status {
      color: #aaa;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <div id="screen">
    <div id="overlay"></div>
    <div id="content">
      <div id="status">Загрузка трендов... 🔥</div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    const API_KEY = 'AIzaSyDAdUwgT0fUEbUBHNTVBdGYKcUNlOLPNf0'; // 👈 ВСТАВЬ СВОЙ КЛЮЧ

    let currentVideo = null; // { id, title, thumbnail }

    // Грубая проверка длительности: считаем "шортсом" всё, что <= 60 сек.
    function isShortDuration(iso8601) {
      // Формат вида PT#M#S / PT#S / PT#H#M#S
      const match = iso8601.match(/^PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/);
      if (!match) return false;
      const hours = parseInt(match[1] || '0', 10);
      const minutes = parseInt(match[2] || '0', 10);
      const seconds = parseInt(match[3] || '0', 10);
      const total = hours * 3600 + minutes * 60 + seconds;
      return total > 0 && total <= 60;
    }

    async function fetchRandomShort() {
      let pageToken = '';
      let attempts = 0;

      while (attempts < 5) {
        attempts++;
        let url = `https://www.googleapis.com/youtube/v3/videos?part=snippet,contentDetails,status&chart=mostPopular&maxResults=50&key=${API_KEY}`;
        if (pageToken) url += `&pageToken=${pageToken}`;

        try {
          const res = await fetch(url);
          const data = await res.json();

          if (data.error) {
            console.error('Ошибка API:', data.error.message);
            return null;
          }

          const shorts = (data.items || []).filter(item => {
            const embeddable = !item.status || item.status.embeddable !== false;
            const duration = item.contentDetails && item.contentDetails.duration;
            return embeddable && duration && isShortDuration(duration);
          });

          if (shorts.length > 0) {
            const pick = shorts[Math.floor(Math.random() * shorts.length)];
            return {
              id: pick.id,
              title: pick.snippet.title,
              thumbnail:
                (pick.snippet.thumbnails.maxres || pick.snippet.thumbnails.high || pick.snippet.thumbnails.medium).url
            };
          }

          pageToken = data.nextPageToken;
          if (!pageToken) return null;
        } catch (e) {
          console.error('Ошибка загрузки:', e);
          return null;
        }
      }
      return null;
    }

    function renderVideo(video) {
      const screen = document.getElementById('screen');
      const content = document.getElementById('content');

      screen.style.backgroundImage = `url('${video.thumbnail}')`;
      content.innerHTML = `
        <div id="title">${video.title}</div>
        <div id="btn">Смотреть в Shorts ▶</div>
      `;
    }

    function renderError() {
      document.getElementById('content').innerHTML =
        '<div id="status">Не удалось найти шортс. Попробуйте открыть заново.</div>';
    }

    async function init() {
      currentVideo = await fetchRandomShort();
      if (currentVideo) {
        renderVideo(currentVideo);
      } else {
        renderError();
      }
    }

    // Открываем официальные YouTube Shorts. openLink() у Telegram
    // работает только как реакция на настоящее касание пользователя,
    // поэтому вешаем обработчик на клик по экрану, а не вызываем сразу.
    document.getElementById('screen').addEventListener('click', () => {
      if (!currentVideo) return;
      const url = `https://www.youtube.com/shorts/${currentVideo.id}`;
      tg.openLink(url);
    });

    init();
  </script>
</body>
</html>
